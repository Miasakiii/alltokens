[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/collectors",
    "crates/proxy",
    "crates/web",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Miasakiii/AllTokens"
description = "Track token usage & cost across all AI API calls"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.35", features = ["bundled", "serde_json"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# File system
dirs = "6"
walkdir = "2"
notify = "7"  # file watcher

# TOML
toml = "0.8"

# HTTP (for proxy & web)
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
rustls-pemfile = "2"

# Regex
regex = "1"

# UUID (for request tracking)
uuid = { version = "1", features = ["v4"] }
